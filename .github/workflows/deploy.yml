name: Scan & Dine Backend CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # =========================================================================
  # 1. TEST & BUILD CHECK (Runs on GitHub Cloud)
  # =========================================================================
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npm run build
        env:
          NODE_ENV: production

  # =========================================================================
  # 2. AUTOMATIC ZERO-INTERACTION DEPLOY TO HOSTINGER VPS
  # =========================================================================
  deploy-to-vps:
    needs: build-and-verify
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: SSH into Hostinger VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'moosadevv' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment on Hostinger VPS..."

            # 1. Load user shell profiles & NVM if present
            [ -f ~/.profile ] && . ~/.profile 2>/dev/null || true
            [ -f ~/.bashrc ] && . ~/.bashrc 2>/dev/null || true
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$HOME/.nvm/nvm.sh" 2>/dev/null || true
            fi
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.npm-global/bin

            # Verify Node.js and npm are available
            echo "🟢 Node version: $(node -v 2>/dev/null || echo 'Node not in PATH')"
            echo "🟢 NPM version: $(npm -v 2>/dev/null || echo 'NPM not in PATH')"

            # 2. Prepare app directory
            if [ -d "$HOME/scan-and-dine/scandine-services/.git" ]; then
              APP_DIR="$HOME/scan-and-dine/scandine-services"
            elif [ -d "$HOME/scan-and-dine/.git" ]; then
              APP_DIR="$HOME/scan-and-dine"
            elif [ -d "$HOME/scan-and-dine/scandine-services" ]; then
              APP_DIR="$HOME/scan-and-dine/scandine-services"
            else
              APP_DIR="$HOME/scan-and-dine"
            fi
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            echo "📂 Working directory: $(pwd)"

            # 3. Authenticated Git Clone / Pull for Private Repository
            REPO_AUTH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            if [ ! -d ".git" ]; then
              echo "📦 First time setup: Cloning private repository branch ${{ github.ref_name }}..."
              find . -mindepth 1 -delete 2>/dev/null || true
              git clone -b ${{ github.ref_name }} "$REPO_AUTH_URL" .
            else
              echo "🔄 Pulling latest changes from ${{ github.ref_name }}..."
              git remote set-url origin "$REPO_AUTH_URL"
              git fetch origin
              git checkout ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
              git clean -fd
              git pull origin ${{ github.ref_name }}
            fi

            # 4. Inject .env from GitHub Secrets & Variables (Dev Server Mode)
            echo "🔐 Writing dev .env configuration..."
            cat << 'EOF' > .env
            NODE_ENV=${{ vars.NODE_ENV || 'development' }}
            PORT=${{ vars.PORT || '8080' }}
            SERVICE_NAME=ALL
            MONGO_URI=${{ secrets.MONGO_URI || 'mongodb://127.0.0.1:27017/scan-and-dine-dev' }}
            MONGO_MAX_POOL_SIZE=${{ vars.MONGO_MAX_POOL_SIZE || '20' }}
            REDIS_HOST=${{ vars.REDIS_HOST || '127.0.0.1' }}
            REDIS_PORT=${{ vars.REDIS_PORT || '6379' }}
            JWT_SECRET=${{ secrets.JWT_SECRET || 'dev_secret_jwt_scan_and_dine_2026' }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN || '7d' }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET || 'dev_refresh_secret_scan_and_dine_2026' }}
            JWT_REFRESH_EXPIRES_IN=${{ vars.JWT_REFRESH_EXPIRES_IN || '30d' }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_placeholder' }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'debug' }}
            EOF

            # 5. Install dependencies
            echo "📥 Installing dependencies..."
            npm install

            # 6. Build TypeScript production artifacts
            echo "🔨 Compiling TypeScript..."
            npm run build

            # 7. Seed initial database records (safe if already seeded)
            echo "🌱 Checking database seed..."
            npm run seed || echo "Seed already present or skipped"

            # 8. Start or Reload PM2 with Zero Downtime
            echo "⚡ Reloading PM2 process on PORT 8080..."
            npx pm2 reload ecosystem.config.cjs --update-env || (npx pm2 delete scan-and-dine-backend 2>/dev/null || true; npx pm2 start ecosystem.config.cjs)
            npx pm2 save || pm2 save

            echo "✅ Deployment completed successfully! Backend is online on PORT 8080."
