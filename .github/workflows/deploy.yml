name: Scan & Dine Backend CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # =========================================================================
  # 1. TEST & BUILD CHECK (Runs on GitHub Cloud)
  # =========================================================================
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npm run build
        env:
          NODE_ENV: production

  # =========================================================================
  # 2. AUTOMATIC ZERO-INTERACTION DEPLOY TO HOSTINGER VPS
  # =========================================================================
  deploy-to-vps:
    needs: build-and-verify
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Hostinger VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'moosadevv' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment on Hostinger VPS..."

            # Ensure PATH finds node, npm, and npx
            export PATH=$PATH:/usr/local/bin:/usr/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.npm-global/bin

            # 1. Determine app directory (user home directory to avoid sudo password prompts)
            APP_DIR="${{ vars.APP_DIR || '' }}"
            if [ -z "$APP_DIR" ]; then
              if [ "$USER" = "root" ]; then
                APP_DIR="/var/www/scan-and-dine"
              else
                APP_DIR="$HOME/scan-and-dine"
              fi
            fi

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            echo "📂 Working directory: $(pwd)"

            # 2. Check if git repo is initialized, if not clone it
            if [ ! -d ".git" ]; then
              echo "📦 First time setup: Cloning repository branch ${{ github.ref_name }}..."
              git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .
            else
              echo "🔄 Pulling latest changes from ${{ github.ref_name }}..."
              git fetch origin
              git checkout ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
              git pull origin ${{ github.ref_name }}
            fi

            # 3. Automatically inject .env from GitHub Secrets & Variables
            echo "🔐 Writing production .env from GitHub Secrets..."
            cat << 'EOF' > .env
            NODE_ENV=production
            PORT=${{ vars.PORT || '8080' }}
            SERVICE_NAME=ALL
            MONGO_URI=${{ secrets.MONGO_URI || 'mongodb://127.0.0.1:27017/scan-and-dine' }}
            MONGO_MAX_POOL_SIZE=${{ vars.MONGO_MAX_POOL_SIZE || '20' }}
            REDIS_HOST=${{ vars.REDIS_HOST || '127.0.0.1' }}
            REDIS_PORT=${{ vars.REDIS_PORT || '6379' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN || '1d' }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=${{ vars.JWT_REFRESH_EXPIRES_IN || '7d' }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_placeholder' }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
            EOF

            # 4. Install dependencies (including devDependencies required for tsc build)
            echo "📥 Installing dependencies..."
            npm install

            # 5. Build TypeScript production artifacts
            echo "🔨 Compiling TypeScript..."
            npm run build

            # 6. Seed initial database records (safe if already seeded)
            echo "🌱 Checking database seed..."
            npm run seed || echo "Seed already present or skipped"

            # 7. Start or Reload PM2 with Zero Downtime
            echo "⚡ Reloading PM2 process on PORT 8080..."
            npx pm2 startOrReload ecosystem.config.cjs --update-env || pm2 startOrReload ecosystem.config.cjs --update-env
            npx pm2 save || pm2 save

            echo "✅ Deployment completed successfully! Backend is online on PORT 8080."
