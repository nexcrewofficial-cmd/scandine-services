name: Scan & Dine Backend CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # =========================================================================
  # 1. TEST & BUILD CHECK (Runs on GitHub Cloud Runner)
  # =========================================================================
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npm run build
        env:
          NODE_ENV: production

  # =========================================================================
  # 2. AUTOMATIC ZERO-INTERACTION DEPLOY TO HOSTINGER VPS
  # =========================================================================
  deploy-to-vps:
    needs: build-and-verify
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Hostinger VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'moosadevv' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            # -------------------------------------------------------------
            # [1/9] Load Shell Environment & Node.js Runtime
            # -------------------------------------------------------------
            echo "🚀 [1/9] Initializing deployment environment..."
            [ -f ~/.profile ] && . ~/.profile 2>/dev/null || true
            [ -f ~/.bashrc ] && . ~/.bashrc 2>/dev/null || true
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$HOME/.nvm/nvm.sh" 2>/dev/null || true
            fi
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.npm-global/bin

            NODE_VER=$(node -v 2>/dev/null || echo "not found")
            NPM_VER=$(npm -v 2>/dev/null || echo "not found")
            echo "   Node.js : ${NODE_VER}"
            echo "   NPM     : ${NPM_VER}"

            if [ "${NODE_VER}" = "not found" ]; then
              echo "❌ Error: Node.js is not available in PATH on the VPS."
              exit 1
            fi

            # -------------------------------------------------------------
            # [2/9] Target Application Directory Validation
            # -------------------------------------------------------------
            echo "📂 [2/9] Resolving application directory..."
            TARGET_BRANCH="${{ github.ref_name }}"
            APP_DIR="/home/moosadevv/scan-and-dine/scandine-services"

            if [ ! -d "$APP_DIR" ]; then
              echo "   Directory $APP_DIR does not exist. Creating..."
              mkdir -p "$APP_DIR"
            fi

            cd "$APP_DIR"
            echo "   Active directory: $(pwd)"

            # -------------------------------------------------------------
            # [3/9] Safe Git Synchronization via Confirmed SSH Remote
            # -------------------------------------------------------------
            echo "🔄 [3/9] Synchronizing code via SSH authentication..."
            SSH_REMOTE="git@github.com:nexcrewofficial-cmd/scandine-services.git"

            if [ ! -d ".git" ]; then
              echo "   Cloning repository via SSH branch ${TARGET_BRANCH}..."
              git clone -b "${TARGET_BRANCH}" "$SSH_REMOTE" .
            else
              echo "   Verifying origin remote..."
              CURRENT_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
              if [ "$CURRENT_REMOTE" != "$SSH_REMOTE" ]; then
                echo "   Updating origin URL to: ${SSH_REMOTE}"
                git remote set-url origin "$SSH_REMOTE"
              fi

              echo "   Fetching branch origin/${TARGET_BRANCH}..."
              git fetch origin "${TARGET_BRANCH}"

              echo "   Checking out branch ${TARGET_BRANCH}..."
              git checkout "${TARGET_BRANCH}"

              echo "   Resetting working tree to match origin/${TARGET_BRANCH}..."
              git reset --hard "origin/${TARGET_BRANCH}"
              git clean -fd
            fi

            DEPLOYED_COMMIT=$(git log -1 --format="%h - %s (%ci)")
            echo "   ✅ Deployed commit: ${DEPLOYED_COMMIT}"

            # -------------------------------------------------------------
            # [4/9] Environment Configuration (.env)
            # -------------------------------------------------------------
            echo "🔐 [4/9] Verifying environment configuration..."
            APP_PORT="${{ vars.PORT || '8080' }}"
            APP_ENV="${{ vars.NODE_ENV || (github.ref == 'refs/heads/main' && 'production' || 'development') }}"
            APP_LOG_LEVEL="${{ vars.LOG_LEVEL || (github.ref == 'refs/heads/main' && 'info' || 'debug') }}"

            # If GitHub Secret MONGO_URI is set, inject managed .env; otherwise protect existing VPS .env
            if [ -n "${{ secrets.MONGO_URI }}" ]; then
              echo "   Generating .env from GitHub Secrets & Variables..."
              cat << 'EOF' > .env
            NODE_ENV=${{ vars.NODE_ENV || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
            PORT=${{ vars.PORT || '8080' }}
            SERVICE_NAME=${{ vars.SERVICE_NAME || 'ALL' }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            MONGO_MAX_POOL_SIZE=${{ vars.MONGO_MAX_POOL_SIZE || '20' }}
            REDIS_HOST=${{ vars.REDIS_HOST || '127.0.0.1' }}
            REDIS_PORT=${{ vars.REDIS_PORT || '6379' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN || '7d' }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=${{ vars.JWT_REFRESH_EXPIRES_IN || '30d' }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || (github.ref == 'refs/heads/main' && 'info' || 'debug') }}
            EOF
            elif [ -f .env ]; then
              echo "   Preserving existing verified .env on VPS."
            else
              echo "⚠️ Warning: No .env found on VPS and secrets.MONGO_URI is unset in GitHub."
            fi

            # -------------------------------------------------------------
            # [5/9] Clean Dependency Installation (npm ci)
            # -------------------------------------------------------------
            echo "📥 [5/9] Installing dependencies (npm ci)..."
            npm ci

            # -------------------------------------------------------------
            # [6/9] TypeScript Compilation & Alias Resolution
            # -------------------------------------------------------------
            echo "🔨 [6/9] Compiling TypeScript backend (npm run build)..."
            npm run build

            # -------------------------------------------------------------
            # [7/9] Database Seed Execution (Idempotent for dev)
            # -------------------------------------------------------------
            if [ "${TARGET_BRANCH}" = "dev" ]; then
              echo "🌱 [7/9] Running database seed (dev branch)..."
              npm run seed
            else
              echo "⏩ [7/9] Skipping database seed for production (${TARGET_BRANCH})."
            fi

            # -------------------------------------------------------------
            # [8/9] PM2 Process Management (Zero Downtime)
            # -------------------------------------------------------------
            echo "⚡ [8/9] Managing PM2 process (scan-and-dine-backend)..."
            if npx pm2 describe scan-and-dine-backend > /dev/null 2>&1; then
              echo "   Existing process found. Reloading configuration..."
              npx pm2 reload ecosystem.config.cjs --update-env
            else
              echo "   Starting new process with ecosystem.config.cjs..."
              npx pm2 start ecosystem.config.cjs
            fi

            echo "💾 Saving PM2 process state..."
            npx pm2 save

            # -------------------------------------------------------------
            # [9/9] Health Verification & Deployment Confirmation
            # -------------------------------------------------------------
            echo "🩺 [9/9] Verifying service health on port ${APP_PORT}..."
            sleep 3

            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${APP_PORT}/api/v1/health" || echo "unreachable")
            echo "   Health check response: HTTP ${HEALTH_STATUS}"

            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Deployment completed successfully! Scan & Dine Backend is online on PORT ${APP_PORT}."
            else
              echo "⚠️ Service responded with HTTP ${HEALTH_STATUS}. Checking recent logs:"
              npx pm2 logs scan-and-dine-backend --lines 15 --nostream || true
            fi

