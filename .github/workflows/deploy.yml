name: Scan & Dine Backend CI/CD

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: scan-dine-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==========================================
  # 1. BUILD AND TEST
  # ==========================================

  build-and-verify:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Backend
        run: npm run build
        env:
          NODE_ENV: production

  # ==========================================
  # 2. DEPLOY TO HOSTINGER VPS
  # ==========================================

  deploy-to-vps:
    name: Deploy Backend
    needs: build-and-verify

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy Through SSH
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}

          timeout: 30s
          command_timeout: 15m
          script_stop: true

          script: |
            set -Eeuo pipefail

            trap 'status=$?; echo "Deployment failed at line $LINENO (exit $status)"; exit "$status"' ERR

            echo "===================================="
            echo "SCAN & DINE BACKEND DEPLOYMENT"
            echo "===================================="

            # 1. Node environment

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            export PATH="$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            node -v
            npm -v
            git --version

            # 2. Configuration

            BRANCH="${{ github.ref_name }}"
            APP_DIR="$HOME/scan-and-dine/scandine-services"
            REPO="git@github.com:nexcrewofficial-cmd/scandine-services.git"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "Branch: $BRANCH"
            echo "Directory: $(pwd)"

            # 3. Git synchronization

            echo "Updating repository..."

            if [ ! -d .git ]; then

              if [ -n "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "Application directory is not empty."
                exit 1
              fi

              git clone -b "$BRANCH" "$REPO" .

            else

              if git remote get-url origin >/dev/null 2>&1; then
                git remote set-url origin "$REPO"
              else
                git remote add origin "$REPO"
              fi

              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git reset --hard "origin/$BRANCH"
              git clean -fd

            fi

            echo "Commit: $(git rev-parse --short HEAD)"

            # 4. Environment validation

            echo "Checking .env..."

            if [ ! -f .env ]; then
              echo "Missing .env file."
              exit 1
            fi

            chmod 600 .env

            for KEY in MONGO_URI JWT_SECRET JWT_REFRESH_SECRET; do
              if ! grep -q "^${KEY}=." .env; then
                echo "Missing required environment variable: $KEY"
                exit 1
              fi
            done

            # 5. Install dependencies

            echo "Installing dependencies..."

            npm ci

            # 6. Build

            echo "Building TypeScript..."

            npm run build

            # 7. Seed development database only

            if [ "$BRANCH" = "dev" ]; then

              echo "Running development database seed..."

              npm run seed

            else

              echo "Skipping production seed."

            fi

            # 8. PM2 deployment

            echo "Checking ecosystem configuration..."

            if [ ! -f ecosystem.config.cjs ]; then
              echo "ecosystem.config.cjs missing."
              exit 1
            fi

            echo "Reloading PM2..."

            if npx --no-install pm2 describe scan-and-dine-backend >/dev/null 2>&1; then

              npx --no-install pm2 startOrReload ecosystem.config.cjs --update-env

            else

              npx --no-install pm2 start ecosystem.config.cjs

            fi

            npx --no-install pm2 save

            npx --no-install pm2 status

            # 9. Health check

            echo "Checking application health..."

            HEALTH_URL="http://127.0.0.1:8080/api/v1/health"
            HEALTHY=false

            for ATTEMPT in $(seq 1 15); do

              STATUS=$(curl -sS \
                --max-time 5 \
                -o /dev/null \
                -w "%{http_code}" \
                "$HEALTH_URL" || true)

              echo "Health check $ATTEMPT: $STATUS"

              if [ "$STATUS" = "200" ]; then
                HEALTHY=true
                break
              fi

              sleep 2

            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Health check failed."
              npx --no-install pm2 logs scan-and-dine-backend --lines 30 --nostream || true
              exit 1
            fi

            echo "===================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Branch: $BRANCH"
            echo "Commit: $(git rev-parse --short HEAD)"
            echo "Port: 8080"
            echo "===================================="